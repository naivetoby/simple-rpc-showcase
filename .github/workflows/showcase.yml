name: Showcase smoke

on: [push, pull_request]
permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.mode }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [jvm, native]
    env:
      APP_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs --no-color --tail=120
      - if: always()
        run: docker compose down -v
