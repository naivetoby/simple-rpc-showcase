name: Showcase smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs --no-color --tail=120
      - if: always()
        run: docker compose down -v
